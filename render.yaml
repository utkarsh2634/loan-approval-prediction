services:
  - type: web
    name: loan-approval-prediction
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.18
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
