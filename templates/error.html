{% extends "base.html" %}

{% block title %}Error {{ status_code }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 3rem 2rem;">
    <div style="font-size: 3.5rem; margin-bottom: 1rem;">
        {% if status_code == 404 %}🔍{% else %}⚠️{% endif %}
    </div>
    <h2 style="color: var(--primary-dark); font-size: 1.8rem; margin-bottom: 0.5rem;">
        {{ error_title }} (Error {{ status_code }})
    </h2>
    <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem;">
        {{ error_message }}
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">🏠 Return to Homepage</a>
</div>
{% endblock %}
